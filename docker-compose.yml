services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      # Always the host Ollama from inside the container (do not use 127.0.0.1 here).
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-deepseek-r1}
      HF_TOKEN: ${HF_TOKEN:-}
      HF_DEFAULT_DAILY_LIMIT: ${HF_DEFAULT_DAILY_LIMIT:-50}
      HF_CHAT_MODEL: ${HF_CHAT_MODEL:-Qwen/Qwen2.5-72B-Instruct}
      HF_PROVIDER: ${HF_PROVIDER:-together}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,https://deep-lm.vercel.app}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_TTL_SECONDS: ${REDIS_TTL_SECONDS:-43200}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy

  # frontend:
  #   build:
  #     context: ./frontend
  #     args:
  #       NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
  #   depends_on:
  #     - backend

volumes:
  redis-data:

