# On the FastAPI API service (not the Redis plugin), add:
#   REDIS_PRIVATE_URL = ${{ Redis.REDIS_PRIVATE_URL }}
# Use the Redis service name from the Railway canvas if it is not "Redis".
# Redeploy the API after saving. GET /health should show "redis": true.

[build]
builder = "RAILPACK"

[deploy]
startCommand = "cd backend && uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}"
restartPolicyType = "ON_FAILURE"

[variables]
REDIS_TTL_SECONDS = "43200"
HF_DEFAULT_DAILY_LIMIT = "50"
GROQ_DEFAULT_DAILY_LIMIT = "30"
HF_PROVIDER = "together"

[environments.local.variables]
REDIS_URL = "redis://127.0.0.1:6379/0"
REDIS_TTL_SECONDS = "43200"
